name: Java + React CI
on:
  push:
    branches: [main, refactor/separate-frontend-backend]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build giao diện React
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Kiểm thử Spring Boot
        working-directory: backend
        run: mvn -B -ntp test
  docker:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra đóng gói React + Spring Boot trên Docker
        run: docker build --tag sinostock-erp:test .
