<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SinoStock ERP - Quản trị doanh nghiệp</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#243850;background:#f1f5f9;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:0;border-radius:8px;background:#0f766e;color:#fff;padding:10px 14px;cursor:pointer}button:disabled{opacity:.6;cursor:default}button.alt{background:#e9f0f6;color:#224466}button.red{background:#fee2e2;color:#991b1b}
input,select{display:block;width:100%;border:1px solid #ccd8e4;border-radius:8px;background:#fff;padding:10px;color:#23374d}label{display:block;font-weight:600;margin:0 0 12px}label input,label select{margin-top:5px}
h1{margin:0;font-size:27px}h2{font-size:18px;margin:0 0 16px}p{color:#64748b}small{color:#64748b}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.nav{background:#122840;color:#fff;padding:24px 15px}.logo{font-weight:900;font-size:24px;margin-bottom:7px}.logo em{font-style:normal;color:#5eead4}
.nav small{color:#a9bcd0}.nav button{display:block;text-align:left;background:transparent;width:100%;margin-top:7px;padding:13px;color:#c8d7e6}.nav button.active{background:#244a61;color:#fff}.main{padding:26px;min-width:0}
.header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.card{border:1px solid #e1e8ef;background:#fff;border-radius:12px;padding:20px;box-shadow:0 5px 16px #1236540b;margin-bottom:16px}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric strong{display:block;font-size:27px;color:#122840}.metric span{color:#64748b}
.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:640px}th,td{border-bottom:1px solid #e8eef3;text-align:left;padding:12px 10px;white-space:nowrap}th{color:#6d849a;font-size:12px}td button{padding:7px 10px;margin-right:5px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.login-bg{min-height:100vh;background:linear-gradient(120deg,#10253f,#136c74);display:grid;place-items:center;padding:15px}.login{width:min(430px,100%);background:#fff;padding:34px;border-radius:18px}.login h1{margin:18px 0 10px}
.tag{display:inline-block;padding:4px 9px;background:#e0f2fe;color:#075985;border-radius:50px;font-size:12px;font-weight:700}.error{background:#fff1f2;color:#a5273b}.toast{position:fixed;right:15px;top:15px;background:#136e5e;color:#fff;border-radius:10px;padding:14px;z-index:5;box-shadow:0 10px 25px #0002}.toast.bad{background:#b91c1c}.hidden{display:none}
@media(max-width:1000px){.metric-grid{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:700px){.shell{display:block}.nav{padding:15px;display:flex;flex-wrap:wrap;gap:5px}.nav .logo{width:100%}.nav button{width:auto;margin:0;padding:8px}.main{padding:13px}.metric-grid{gap:7px}.card{padding:14px}}
</style></head><body><div id="app"></div><script>
"use strict";
const state={token:sessionStorage.getItem("erp_token")||"",role:sessionStorage.getItem("erp_role")||"",username:sessionStorage.getItem("erp_name")||"",tab:"overview",products:[],orders:[]};
const $=id=>document.getElementById(id),escape=v=>String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const currency=n=>Number(n||0).toLocaleString("vi-VN",{minimumFractionDigits:2,maximumFractionDigits:2})+" ¥";
const roles={ADMIN:"Quản trị hệ thống",WAREHOUSE_MANAGER:"Quản lý kho",SALES_STAFF:"Nhân viên bán hàng",ACCOUNTANT:"Kế toán",PURCHASING_MANAGER:"Quản lý mua hàng",GENERAL_MANAGER:"Giám đốc",STAFF:"Nhân viên (cũ)"};
const statuses={PENDING:"Chờ xác nhận",CONFIRMED:"Đã xác nhận",CANCELLED:"Đã hủy",DRAFT:"Chờ nhập kho",RECEIVED:"Đã nhập kho"};
const navigation=[
 ["overview","Tổng quan",["ADMIN","WAREHOUSE_MANAGER","SALES_STAFF","ACCOUNTANT","PURCHASING_MANAGER","GENERAL_MANAGER","STAFF"]],
 ["products","Hàng hóa - kho",["ADMIN","WAREHOUSE_MANAGER","SALES_STAFF","ACCOUNTANT","PURCHASING_MANAGER","GENERAL_MANAGER","STAFF"]],
 ["orders","Bán hàng",["ADMIN","SALES_STAFF","ACCOUNTANT","GENERAL_MANAGER","STAFF"]],
 ["customers","Khách hàng",["ADMIN","SALES_STAFF","GENERAL_MANAGER"]],
 ["suppliers","Nhà cung cấp",["ADMIN","PURCHASING_MANAGER"]],
 ["purchasing","Mua hàng - nhập kho",["ADMIN","PURCHASING_MANAGER"]],
 ["accounting","Kế toán - công nợ",["ADMIN","ACCOUNTANT","GENERAL_MANAGER"]],
 ["reports","Báo cáo điều hành",["ADMIN","GENERAL_MANAGER","ACCOUNTANT"]],
 ["users","Tài khoản - phân quyền",["ADMIN"]]];
const can=tab=>navigation.find(x=>x[0]===tab)?.[2].includes(state.role)===true;
function toast(t,bad=false){let e=$("toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e);}e.className="toast"+(bad?" bad":"");e.textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.remove(),4000);}
async function api(path,method="GET",body){let r;try{r=await fetch("/api"+path,{method,headers:{"Content-Type":"application/json",...(state.token?{Authorization:"Bearer "+state.token}:{})},...(body!==undefined?{body:JSON.stringify(body)}:{})});}catch{throw Error("Không thể kết nối máy chủ");}
 const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch{data=null;}
 if(!r.ok){if(r.status===401&&path!=="/auth/login"){logout();throw Error("Phiên đăng nhập đã hết hạn");}throw Error(data?.message||("Yêu cầu thất bại: HTTP "+r.status));}return data;}
function logout(){sessionStorage.removeItem("erp_token");sessionStorage.removeItem("erp_name");sessionStorage.removeItem("erp_role");state.token="";state.role="";state.username="";login();}
function login(){$("app").innerHTML='<div class="login-bg"><form class="login" id="loginForm"><div class="logo" style="color:#173550">Sino<em>Stock</em> ERP</div><h1>Đăng nhập</h1><p>Hệ thống quản trị kho, bán hàng và tài chính</p><label>Tên đăng nhập<input name="username" value="admin" required autocomplete="username"></label><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label><button style="width:100%">Đăng nhập</button></form></div>';
 $("loginForm").onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector("button");btn.disabled=true;try{const f=new FormData(e.target),r=await api("/auth/login","POST",{username:f.get("username"),password:f.get("password")});state.token=r.token;state.username=r.username;state.role=r.role;sessionStorage.setItem("erp_token",r.token);sessionStorage.setItem("erp_name",r.username);sessionStorage.setItem("erp_role",r.role);state.tab="overview";await shell();}catch(err){toast(err.message,true)}finally{btn.disabled=false;}};}
async function shell(){if(!state.token){login();return;}
 if(!can(state.tab))state.tab="overview";
 $("app").innerHTML='<div class="shell"><aside class="nav"><div><div class="logo">Sino<em>Stock</em> ERP</div><small>Quản trị doanh nghiệp</small></div><div id="menu"></div><p style="color:#a9bcd0;margin-top:40px">Java 21 · PostgreSQL</p></aside><main class="main"><div class="header"><div><h1 id="pageTitle"></h1><p>Hệ thống điều hành SinoStock ERP</p></div><div class="row"><span class="tag">'+escape(state.username)+' · '+escape(roles[state.role]||state.role)+'</span><button class="alt" id="refresh">Làm mới</button><button class="alt" id="signout">Đăng xuất</button></div></div><div id="content"></div></main></div>';
 $("menu").innerHTML=navigation.filter(n=>can(n[0])).map(n=>'<button data-tab="'+n[0]+'" class="'+(n[0]===state.tab?"active":"")+'">'+escape(n[1])+'</button>').join("");
 $("menu").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;shell()});
 $("refresh").onclick=()=>renderTab();$("signout").onclick=logout;await renderTab();}
function content(html){$("content").innerHTML=html;const n=navigation.find(x=>x[0]===state.tab);$("pageTitle").textContent=n?.[1]||"Tổng quan";}
function table(headers,rows){return '<div class="table"><table><thead><tr>'+headers.map(h=>'<th>'+escape(h)+'</th>').join("")+'</tr></thead><tbody>'+ (rows.length?rows.join(""):'<tr><td colspan="'+headers.length+'">Chưa có dữ liệu</td></tr>')+'</tbody></table></div>';}
function row(...cells){return '<tr>'+cells.map(c=>'<td>'+c+'</td>').join("")+'</tr>';}
const options=(items,nameFn)=>items.map(x=>'<option value="'+Number(x.id)+'">'+escape(nameFn(x))+'</option>').join("");
const productName=p=>p.nameCn||p.nameEn||"Sản phẩm";
async function renderTab(){if(!can(state.tab)){toast("Không có quyền truy cập",true);state.tab="overview";return shell();}
 content('<div class="card">Đang tải dữ liệu...</div>');
 try{
 if(state.tab==="overview"){const d=await api("/dashboard");content('<div class="metric-grid">'+[["Sản phẩm",d.totalProducts],["Đơn chờ xử lý",d.pendingOrders],["Đơn đã xác nhận",d.confirmedOrders],["Doanh thu xác nhận",currency(d.totalRevenueCny)]].map(x=>'<div class="card metric"><span>'+x[0]+'</span><strong>'+escape(x[1])+'</strong></div>').join("")+'</div><div class="card"><h2>Cảnh báo tồn kho</h2><p>Có '+escape(d.lowStockProducts)+' sản phẩm dưới ngưỡng cảnh báo.</p></div>'+table(["Ngày","Số đơn","Doanh thu"],d.dailyRevenue.map(x=>row(escape(x.date),escape(x.orders),escape(currency(x.revenueCny))))));}
 else if(state.tab==="products"){const ps=await api("/products");state.products=ps;const edit=["ADMIN","WAREHOUSE_MANAGER"].includes(state.role);
 content((edit?'<div class="card"><h2>Thêm sản phẩm</h2><form id="addProduct" class="grid"><label>Mã SKU<input name="sku" required></label><label>Tên sản phẩm<input name="nameCn" required></label><label>Giá bán (CNY)<input name="priceCny" type="number" step=".01" min=".01" required></label><label>Tồn kho ban đầu<input name="stockQuantity" type="number" min="0" value="0" required></label><label>Ngưỡng cảnh báo<input name="lowStockThreshold" type="number" min="0" value="5" required></label><div><button>Thêm sản phẩm</button></div></form></div>':"")+'<div class="card"><h2>Danh sách sản phẩm</h2>'+table(["SKU","Sản phẩm","Giá bán","Tồn kho","Thao tác"],ps.map(p=>row(escape(p.sku),escape(productName(p)),escape(currency(p.priceCny)),escape(p.stockQuantity),edit?'<button data-adjust="'+p.id+'" class="alt">Điều chỉnh kho</button>':"")) )+'</div>');
 if(edit){$("addProduct").onsubmit=submitForm("/products",f=>({sku:f.get("sku"),nameCn:f.get("nameCn"),nameEn:f.get("nameCn"),priceCny:Number(f.get("priceCny")),stockQuantity:Number(f.get("stockQuantity")),lowStockThreshold:Number(f.get("lowStockThreshold"))}));document.querySelectorAll("[data-adjust]").forEach(b=>b.onclick=async()=>{const count=prompt("Nhập lượng thay đổi (+ nhập / - xuất):");if(count===null)return;const n=Number(count);if(!Number.isInteger(n)||n===0)return toast("Số lượng phải là số nguyên khác 0",true);await action("/products/"+b.dataset.adjust+"/stock","PATCH",{changeQuantity:n,reason:"Điều chỉnh kho"});});}}
 else if(state.tab==="orders"){const [ps,os]=await Promise.all([api("/products"),api("/orders")]);state.products=ps;state.orders=os;const edit=["ADMIN","SALES_STAFF","STAFF"].includes(state.role);
 content((edit?'<div class="card"><h2>Tạo đơn hàng</h2><form id="addOrder" class="grid"><label>Sản phẩm<select name="productId" required>'+options(ps,productName)+'</select></label><label>Số lượng<input name="quantity" type="number" min="1" value="1" required></label><div><button>Tạo đơn chờ xác nhận</button></div></form></div>':"")+'<div class="card"><h2>Danh sách đơn hàng</h2>'+table(["Mã đơn","Thành tiền","Trạng thái","Thao tác"],os.map(o=>row(escape(o.orderNumber),escape(currency(o.totalAmountCny)),escape(statuses[o.status]||o.status),edit?(o.status==="PENDING"?'<button data-order="'+o.id+'" data-op="confirm">Xác nhận</button>':"")+(o.status!=="CANCELLED"?'<button class="red" data-order="'+o.id+'" data-op="cancel">Hủy</button>':""):"")) )+'</div>');
 if(edit){$("addOrder").onsubmit=submitForm("/orders",f=>({items:[{productId:Number(f.get("productId")),quantity:Number(f.get("quantity"))}]}));document.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>action("/orders/"+b.dataset.order+"/"+b.dataset.op,"PATCH"));}}
 else if(state.tab==="customers"||state.tab==="suppliers"){const supplier=state.tab==="suppliers",path=supplier?"/suppliers":"/customers",xs=await api(path);content('<div class="card"><h2>Thêm '+(supplier?"nhà cung cấp":"khách hàng")+'</h2><form id="addPartner" class="grid"><label>Tên<input name="name" required></label><label>Điện thoại<input name="phone"></label><label>Email<input name="email" type="email"></label><label>Địa chỉ<input name="address"></label><div><button>Lưu thông tin</button></div></form></div><div class="card"><h2>Danh sách</h2>'+table(["Tên","Điện thoại","Email","Địa chỉ"],xs.map(x=>row(escape(x.name),escape(x.phone),escape(x.email),escape(x.address))))+'</div>');$("addPartner").onsubmit=submitForm(path,f=>Object.fromEntries(f.entries()));}
 else if(state.tab==="purchasing"){const [po,suppliers,ps]=await Promise.all([api("/purchasing"),api("/suppliers"),api("/products")]);content('<div class="card"><h2>Lập phiếu mua hàng</h2><form id="addPurchase" class="grid"><label>Nhà cung cấp<select name="supplierId" required>'+options(suppliers,s=>s.name)+'</select></label><label>Sản phẩm<select name="productId" required>'+options(ps,productName)+'</select></label><label>Số lượng<input name="quantity" type="number" min="1" value="1" required></label><label>Đơn giá nhập (CNY)<input name="unitCostCny" type="number" step=".01" min=".01" required></label><div><button>Tạo phiếu mua</button></div></form></div><div class="card"><h2>Phiếu mua hàng</h2>'+table(["Mã phiếu","Nhà cung cấp","SKU","Số lượng","Giá nhập","Trạng thái","Thao tác"],po.map(x=>row(escape(x.reference),escape(x.supplier),escape(x.sku),escape(x.quantity),escape(currency(x.unitCostCny)),escape(statuses[x.status]||x.status),x.status==="DRAFT"?'<button data-purchase="'+x.id+'" data-op="receive">Nhập kho</button><button class="red" data-purchase="'+x.id+'" data-op="cancel">Hủy</button>':"")))+'</div>');$("addPurchase").onsubmit=submitForm("/purchasing",f=>({supplierId:Number(f.get("supplierId")),productId:Number(f.get("productId")),quantity:Number(f.get("quantity")),unitCostCny:Number(f.get("unitCostCny"))}));document.querySelectorAll("[data-purchase]").forEach(b=>b.onclick=()=>action("/purchasing/"+b.dataset.purchase+"/"+b.dataset.op,"PATCH"));}
 else if(state.tab==="accounting"){const [rs,ps]=await Promise.all([api("/accounting/receivables"),api("/accounting/payments")]);const allowed=["ADMIN","ACCOUNTANT"].includes(state.role);content((allowed?'<div class="card"><h2>Ghi nhận thu tiền</h2><form id="addPayment" class="grid"><label>Đơn đã xác nhận<select name="orderId" required>'+options(rs.filter(x=>Number(x.outstanding)>0),x=>x.orderNumber+" - còn "+currency(x.outstanding))+'</select></label><label>Số tiền thu (CNY)<input name="amountCny" type="number" min=".01" step=".01" required></label><label>Phương thức<select name="method"><option value="TRANSFER">Chuyển khoản</option><option value="CASH">Tiền mặt</option></select></label><div><button>Ghi nhận thanh toán</button></div></form></div>':"")+'<div class="card"><h2>Công nợ phải thu</h2>'+table(["Đơn hàng","Giá trị","Đã thu","Còn nợ"],rs.map(x=>row(escape(x.orderNumber),escape(currency(x.total)),escape(currency(x.paid)),escape(currency(x.outstanding)))) )+'</div><div class="card"><h2>Lịch sử thu tiền</h2>'+table(["Đơn hàng","Số tiền","Phương thức","Ngày"],ps.map(x=>row(escape(x.orderNumber),escape(currency(x.amountCny)),escape(x.method),escape(x.createdAt?.slice(0,10)))))+'</div>');if(allowed)$("addPayment").onsubmit=submitForm("/accounting/payments",f=>({orderId:Number(f.get("orderId")),amountCny:Number(f.get("amountCny")),method:f.get("method")}));}
 else if(state.tab==="reports"){const x=await api("/reports/summary");content('<div class="metric-grid">'+[["Doanh thu đơn xác nhận",currency(x.confirmedRevenueCny)],["Đã ghi nhận thu",currency(x.recordedReceiptsCny)],["Công nợ còn lại",currency(x.pendingReceivablesCny)],["Chi phí nhập hàng",currency(x.receivedPurchaseCostCny)]].map(([a,b])=>'<div class="card metric"><span>'+a+'</span><strong>'+escape(b)+'</strong></div>').join("")+'</div><div class="card"><p>Số đơn bán: '+escape(x.totalOrders)+' · Số phiếu mua: '+escape(x.totalPurchaseOrders)+'</p><small>Báo cáo phục vụ demo; không thay thế sổ kế toán chính thức.</small></div>');}
 else if(state.tab==="users"){const us=await api("/admin/users");content('<div class="card"><h2>Tạo tài khoản nhân viên</h2><form id="addUser" class="grid"><label>Tên đăng nhập<input name="username" required></label><label>Mật khẩu tối thiểu 12 ký tự<input name="password" type="password" minlength="12" required></label><label>Vai trò<select name="role">'+Object.entries(roles).filter(x=>x[0]!=="STAFF").map(x=>'<option value="'+x[0]+'">'+escape(x[1])+'</option>').join("")+'</select></label><div><button>Tạo tài khoản</button></div></form></div><div class="card"><h2>Người dùng</h2>'+table(["Tài khoản","Vai trò","Thao tác"],us.map(u=>row(escape(u.username),escape(roles[u.role]||u.role),'<button data-user="'+u.id+'" class="alt">Đổi vai trò</button><button data-reset="'+u.id+'" class="alt">Đặt lại mật khẩu</button>')))+'</div>');$("addUser").onsubmit=submitForm("/admin/users",f=>Object.fromEntries(f.entries()));document.querySelectorAll("[data-user]").forEach(b=>b.onclick=async()=>{const role=prompt("Nhập vai trò: "+Object.keys(roles).filter(x=>x!=="STAFF").join(", "));if(!role)return;if(!roles[role])return toast("Vai trò không hợp lệ",true);await action("/admin/users/"+b.dataset.user+"/role","PATCH",{role});});document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async()=>{const pw=prompt("Nhập mật khẩu mới (ít nhất 12 ký tự):");if(pw===null)return;if(pw.length<12)return toast("Mật khẩu quá ngắn",true);await action("/admin/users/"+b.dataset.reset+"/password","PATCH",{password:pw});});}
 }catch(err){toast(err.message,true);content('<div class="card">Không thể tải dữ liệu: '+escape(err.message)+'</div>');}}
function submitForm(path,makeBody){return async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;try{await api(path,"POST",makeBody(new FormData(e.target)));toast("Đã lưu thành công");await renderTab();}catch(err){toast(err.message,true)}finally{b.disabled=false;}};}
async function action(path,method,body){try{await api(path,method,body);toast("Đã cập nhật thành công");await renderTab();}catch(err){toast(err.message,true);}}
if(state.token)shell();else login();
</script></body></html>
