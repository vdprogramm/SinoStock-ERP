<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SinoStock ERP | Quản lý kho và đơn hàng</title>
  <style>
    :root { --navy:#12233e;--navy2:#1a3454;--mint:#16a59a;--bg:#f3f6fa;--text:#23364c;--muted:#758397;--border:#e3e9f0;--danger:#d44949 }
    *{box-sizing:border-box}
    body{margin:0;color:var(--text);background:var(--bg);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    button,input,select{font:inherit}
    button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;font-weight:650;background:var(--mint);color:#fff}
    button:disabled{opacity:.45;cursor:not-allowed}
    button.secondary{color:#25415e;background:#eaf0f7}
    button.danger{background:#fff0ee;color:var(--danger)}
    input,select{min-height:40px;width:100%;padding:9px 11px;border:1px solid #d7e0ea;border-radius:8px;background:#fff;color:var(--text)}
    label{display:block;font-weight:600;margin-bottom:6px;color:#4e637b}
    small{color:var(--muted)}
    .app{min-height:100vh;display:grid;grid-template-columns:228px minmax(0,1fr)}
    .sidebar{background:var(--navy);color:#fff;padding:29px 19px}
    .brand{font-weight:800;font-size:23px;letter-spacing:-.6px}.brand span{color:#53d0c2}
    .sidebar small{color:#bdcbd9}
    .sidebar a{display:flex;align-items:center;gap:9px;color:#c4d2df;text-decoration:none;padding:12px;border-radius:9px;margin-top:15px;background:#213c5b}
    main{min-width:0;max-width:1450px;width:100%;padding:30px clamp(16px,3vw,45px)}
    header{display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{margin:0;font-size:28px;letter-spacing:-.6px}
    h2{margin:0 0 18px;font-size:18px}
    .sub{color:var(--muted);margin-top:4px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:25px}
    .card,.panel{border:1px solid var(--border);background:#fff;border-radius:12px;box-shadow:0 4px 22px #12365409}
    .card{padding:22px}.card span{color:#697e93;font-weight:600}.card strong{font-size:27px;display:block;margin-top:8px;color:#1a3454}
    .panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
    .panel{padding:23px;min-width:0}
    .full{grid-column:1/-1}
    .table-wrap{overflow:auto}
    table{border-collapse:collapse;width:100%;min-width:590px}
    th,td{text-align:left;border-bottom:1px solid #eaf0f5;padding:12px 9px;white-space:nowrap}
    th{color:#7890a5;font-size:12px;text-transform:uppercase;font-weight:750}
    td{color:#344a5f}
    td button{padding:6px 9px;font-size:12px;margin-right:5px}
    .pill{display:inline-block;border-radius:40px;padding:5px 11px;font-weight:750;font-size:12px;background:#fff4db;color:#98600e}
    .pill.CONFIRMED{background:#e4f6f1;color:#18775d}
    .pill.CANCELLED{background:#f9e8ea;color:#b84953}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{margin-bottom:12px}
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(130deg,#10243f,#1b5162);padding:20px}
    .login{width:min(440px,100%);padding:36px;background:#fff;border-radius:18px;box-shadow:0 25px 70px #0015}
    .login h1{margin:4px 0 7px}.login .field{margin-top:17px}
    .login button{width:100%;margin-top:8px}
    #message{display:none;position:fixed;top:16px;right:16px;max-width:400px;padding:13px 17px;border-radius:10px;box-shadow:0 12px 30px #092c4827;background:#1d735f;color:#fff;z-index:5}
    #message.error{background:#ab3e47}
    .empty{padding:23px;color:var(--muted);text-align:center}
    @media (max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}
    @media (max-width:660px){.app{display:block}.sidebar{padding:14px 20px}.sidebar a{display:none}.cards{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.card strong{font-size:23px}main{padding:17px 12px}.panel{padding:16px}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="message"></div>
<div id="root"></div>
<script>
"use strict";
const state={token:sessionStorage.getItem("sino_token")||"",user:sessionStorage.getItem("sino_user")||"",role:sessionStorage.getItem("sino_role")||"",products:[],orders:[],dashboard:null};
const el=id=>document.getElementById(id);
const roleVi={ADMIN:"Quản trị viên",STAFF:"Nhân viên"};
const statusVi={PENDING:"Chờ xác nhận",CONFIRMED:"Đã xác nhận",CANCELLED:"Đã hủy"};
const demoNamesVi={"无线鼠标":"Chuột không dây","机械键盘":"Bàn phím cơ","USB-C数据线":"Cáp USB-C"};
const productName=p=>demoNamesVi[p.nameCn]||p.nameCn||p.nameEn||"Sản phẩm chưa có tên";

function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function notify(message,error=false){const n=el("message");n.textContent=message;n.className=error?"error":"";n.style.display="block";clearTimeout(notify.t);notify.t=setTimeout(()=>n.style.display="none",4500);}
const money=n=>Number(n||0).toLocaleString("vi-VN",{minimumFractionDigits:2,maximumFractionDigits:2})+" ¥";
async function api(path,method="GET",body){
  const opts={method,headers:{"Content-Type":"application/json",...(state.token?{"Authorization":"Bearer "+state.token}:{})}};
  if(body!==undefined)opts.body=JSON.stringify(body);
  let res;
  try{res=await fetch("/api"+path,opts);}catch(e){throw Error("Không thể kết nối máy chủ. Vui lòng thử lại.");}
  let data=null;try{data=await res.json();}catch(e){}
  if(!res.ok){
    if(res.status===401&&path!=="/auth/login"){signOut();throw Error("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.");}
    throw Error(data?.message||"HTTP "+res.status);
  }
  return data;
}
function signOut(){Object.keys(sessionStorage).filter(x=>x.startsWith("sino_")).forEach(x=>sessionStorage.removeItem(x));state.token="";state.user="";state.role="";renderLogin();}
function renderLogin(){
  el("root").innerHTML=`<div class="login-wrap"><div class="login">
    <div class="brand" style="color:#12233e">Sino<span>Stock</span> ERP</div>
    <p class="sub">Hệ thống quản lý kho và đơn hàng</p>
    <h1>Chào mừng trở lại</h1><p class="sub">Vui lòng đăng nhập vào hệ thống</p>
    <form id="loginForm">
      <div class="field"><label for="username">Tên đăng nhập</label><input id="username" autocomplete="username" required value="admin"></div>
      <div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">Đăng nhập</button>
    </form><p class="sub" style="margin-top:23px">Kết nối bảo mật · Hệ thống quản lý SinoStock</p>
  </div></div>`;
  el("loginForm").onsubmit=async(e)=>{
    e.preventDefault();
    const btn=e.target.querySelector("button");btn.disabled=true;
    try{
      const d=await api("/auth/login","POST",{username:el("username").value,password:el("password").value});
      state.token=d.token;state.user=d.username;state.role=d.role;
      sessionStorage.setItem("sino_token",d.token);sessionStorage.setItem("sino_user",d.username);sessionStorage.setItem("sino_role",d.role);
      await showDashboard();
    }catch(err){notify(err.message,true)}finally{btn.disabled=false}
  };
}
async function showDashboard(){
  if(!state.token){renderLogin();return;}
  el("root").innerHTML=`<div class="app">
    <aside class="sidebar"><div class="brand">Sino<span>Stock</span></div>
      <small>Quản lý kho và đơn hàng</small><a href="#dashboard">▦ &nbsp; Tổng quan</a>
      <div style="margin-top:40px;color:#9fb6c8;font-size:12px">QUẢN LÝ NGHIỆP VỤ</div>
      <a href="#inventory">▤ &nbsp; Hàng hóa</a>
      <a href="#orders">▣ &nbsp; Đơn hàng</a>
      <div style="margin-top:35px"><small>Java 21 · Spring Boot · PostgreSQL</small></div>
    </aside>
    <main><header><div><h1>Tổng quan kinh doanh</h1>
     <p class="sub">Theo dõi hàng hóa, đơn hàng và doanh thu</p></div>
     <div class="actions"><small>${escapeHtml(state.user)} · ${escapeHtml(roleVi[state.role]||state.role)}</small>
     <button class="secondary" id="refresh">Làm mới</button>
     <button class="secondary" id="logout">Đăng xuất</button></div></header>
    <section class="cards" id="stats"></section>
    <div class="panels">
      <section class="panel" id="inventory"><h2>Danh sách hàng hóa và tồn kho</h2><div class="table-wrap" id="productTable"></div></section>
      <section class="panel" id="orders"><h2>Quản lý đơn hàng</h2><div class="table-wrap" id="ordersTable"></div></section>
      <section class="panel" id="create-order"><h2>Tạo đơn hàng</h2>
        <form id="orderForm"><div class="form-grid">
        <div class="field"><label>Sản phẩm</label><select id="orderProduct" required></select></div>
        <div class="field"><label>Số lượng</label><input id="orderQuantity" type="number" min="1" value="1" required></div>
        </div><button type="submit">Tạo đơn hàng chờ xác nhận</button></form>
        <p class="sub">Số lượng tồn kho chỉ được trừ khi xác nhận đơn hàng.</p>
      </section>
      <section class="panel" id="new-product"><h2>Thêm sản phẩm mới</h2>
        <form id="productForm"><div class="form-grid">
        <div class="field"><label>SKU</label><input name="sku" required placeholder="SP-004"></div>
        <div class="field"><label>Tên sản phẩm</label><input name="nameCn" required placeholder="Ví dụ: Tai nghe Bluetooth"></div>
        
        <div class="field"><label>Giá bán (CNY)</label><input name="priceCny" type="number" min=".01" step=".01" required></div>
        <div class="field"><label>Số lượng tồn kho</label><input name="stockQuantity" type="number" min="0" value="10" required></div>
        <div class="field"><label>Ngưỡng cảnh báo tồn kho</label><input name="lowStockThreshold" type="number" min="0" value="5" required></div>
        </div><button type="submit">Lưu sản phẩm</button></form>
      </section>
    </div><p class="sub" style="margin-top:25px">SinoStock ERP · Hệ thống quản lý kho và đơn hàng · Dữ liệu được lưu trên PostgreSQL</p>
    </main></div>`;
  el("logout").onclick=signOut;el("refresh").onclick=refresh;
  el("orderForm").onsubmit=createOrder;el("productForm").onsubmit=createProduct;
  if(state.role!=="ADMIN")el("new-product").style.display="none";
  await refresh();
}
async function refresh(){
 try{
   const [dashboard,products,orders]=await Promise.all([api("/dashboard"),api("/products"),api("/orders")]);
   state.dashboard=dashboard;state.products=products;state.orders=orders;
   el("stats").innerHTML=[
    ["Tổng doanh thu",money(dashboard.totalRevenueCny)],
    ["Đơn đã xác nhận",dashboard.confirmedOrders],
    ["Đơn chờ xác nhận",dashboard.pendingOrders],
    ["Sản phẩm sắp hết",dashboard.lowStockProducts]
   ].map(([label,value])=>`<div class="card"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join("");
   el("productTable").innerHTML=`<table><thead><tr><th>SKU</th><th>Sản phẩm</th><th>Giá bán</th><th>Tồn kho</th></tr></thead><tbody>${
     products.map(p=>`<tr><td>${escapeHtml(p.sku)}</td><td>${escapeHtml(productName(p))}</td><td>${escapeHtml(money(p.priceCny))}</td><td>${p.stockQuantity<=p.lowStockThreshold?'<span style="color:#d44949">⚠ </span>':''}${escapeHtml(p.stockQuantity)}</td></tr>`).join("")
    ||'<tr><td colspan="4" class="empty">Chưa có sản phẩm nào</td></tr>'}</tbody></table>`;
   el("ordersTable").innerHTML=`<table><thead><tr><th>Mã đơn hàng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${
     orders.map(o=>`<tr><td>${escapeHtml(o.orderNumber)}</td><td>${escapeHtml(money(o.totalAmountCny))}</td><td><span class="pill ${escapeHtml(o.status)}">${escapeHtml(statusVi[o.status]||o.status)}</span></td><td>
     ${o.status==="PENDING"?`<button data-action="confirm" data-id="${Number(o.id)}">Xác nhận</button>`:""}
     ${o.status!=="CANCELLED"?`<button class="danger" data-action="cancel" data-id="${Number(o.id)}">Hủy đơn</button>`:""}</td></tr>`).join("")
    ||'<tr><td colspan="4" class="empty">Chưa có đơn hàng nào</td></tr>'}</tbody></table>`;
   el("orderProduct").innerHTML=products.map(p=>`<option value="${Number(p.id)}">${escapeHtml(productName(p))} · ${escapeHtml(p.sku)} (${p.stockQuantity})</option>`).join("");
   el("ordersTable").querySelectorAll("button[data-action]").forEach(b=>b.onclick=async()=>{
     b.disabled=true;
     try{await api("/orders/"+b.dataset.id+"/"+b.dataset.action,"PATCH");notify("Đã cập nhật trạng thái đơn hàng");await refresh();}
     catch(e){notify(e.message,true);b.disabled=false;}
   });
 }catch(e){notify(e.message,true)}
}
async function createOrder(e){
 e.preventDefault();
 const id=Number(el("orderProduct").value),quantity=Number(el("orderQuantity").value);
 if(!Number.isInteger(id)||id<1||!Number.isInteger(quantity)||quantity<1){notify("Vui lòng chọn sản phẩm và nhập số lượng hợp lệ",true);return;}
 const b=e.target.querySelector('button');b.disabled=true;
 try{await api("/orders","POST",{items:[{productId:id,quantity}]});notify("Đã tạo đơn hàng chờ xác nhận");await refresh();}
 catch(err){notify(err.message,true)}finally{b.disabled=false;}
}
async function createProduct(e){
 e.preventDefault();const f=new FormData(e.target);
 const body={sku:f.get("sku"),nameCn:f.get("nameCn"),nameEn:f.get("nameCn"),priceCny:Number(f.get("priceCny")),stockQuantity:Number(f.get("stockQuantity")),lowStockThreshold:Number(f.get("lowStockThreshold"))};
 const b=e.target.querySelector('button');b.disabled=true;
 try{await api("/products","POST",body);notify("Đã thêm sản phẩm thành công");e.target.reset();await refresh();}
 catch(err){notify(err.message,true)}finally{b.disabled=false;}
}
if(state.token)showDashboard();else renderLogin();
</script>
</body></html>
