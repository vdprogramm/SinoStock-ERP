server:
  port: ${PORT:8080}
spring:
  application:
    name: sinostock-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sinostock_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # MVP only; migrate with Flyway before real production
    properties:
      hibernate:
        format_sql: false
app:
  jwt-secret: ${JWT_SECRET:SINOSTOCK-LOCAL-DEMO-ONLY-CHANGE-ME-BEFORE-DEPLOY}
  jwt-expiration-minutes: 120
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  seed-demo: ${SEED_DEMO:true}
  seed-sample-products: ${SEED_SAMPLE_PRODUCTS:false}
  bootstrap-admin-username: ${ADMIN_USERNAME:admin}
  bootstrap-admin-password: ${ADMIN_PASSWORD:}
