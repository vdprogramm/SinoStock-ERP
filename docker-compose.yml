services:
  postgres:
    image: postgres:17
    container_name: sinostock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sinostock_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sinostock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sinostock_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sinostock_pgdata:
