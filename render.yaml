# Render Blueprint: Web Service + free PostgreSQL database.
# WARNING: free Render PostgreSQL expires after 30 days (demo only).
services:
  - type: web
    name: sinostock-erp-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sinostock-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "false"
      - key: SEED_SAMPLE_PRODUCTS
        value: "true"
      - key: DB_POOL_SIZE
        value: "3"

databases:
  - name: sinostock-erp-db
    plan: free
    region: singapore
    databaseName: sinostock
    user: sinostock
